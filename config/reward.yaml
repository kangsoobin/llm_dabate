# ============================================================
#  GRPO 보상 설계 설정
#  version: v1 (보상 설계.pdf 원안) | v2 (docs/reward_design_v2.md 재설계) | v3 (성향 유지/반박 품질/토론 전개 3축 강화, 기본값)
#  rl/train_grpo.py --reward-version 플래그로 이 파일의 version을 덮어쓸 수 있다.
# ============================================================

version: "v3"

# ── Judge 모델 설정 ──────────────────────────────────────────
# backend: "none" | "local" | "api"
#   none  : judge 없이 judge-free 컴포넌트만 사용 (v2는 이 상태로도 동작함 — 기본 권장)
#   local : 로컬 소형 모델(예: Qwen2.5-7B)을 judge로 로드 (rl/rewards/judge.py LocalJudge)
#   api   : 외부 API(OpenAI/Anthropic 호환)를 judge로 사용 (APIJudge)
# v1(보상 설계.pdf 원안)은 judge가 필수이므로 반드시 local 또는 api로 설정해야 한다.
judge:
  backend: "none"
  local:
    model_id: "Qwen/Qwen2.5-7B-Instruct"
    gpu_id: 2                 # judge 전용 GPU 가정 (3번째 GPU). 없으면 여유 VRAM이 있는 GPU로 변경
    quantization: "4bit"
  api:
    provider: "anthropic"      # "anthropic" | "openai"
    model: "claude-haiku-4-5-20251001"
    api_key_env: "ANTHROPIC_API_KEY"

# ── v1: 보상 설계.pdf 원안 (성향/반박품질/자기반복) ───────────
v1:
  weights:
    stance: 1.0
    rebuttal: 1.0
    antirep: 1.0
  antirep:
    tau: 0.25
    gamma: 1.5

# ── v2: docs/reward_design_v2.md 재설계 ──────────────────────
v2:
  # 2026-07-04: ko-sroberta(max_seq_length 128 — 600토큰 발언이 앞부분만 잘림) →
  # BAAI/bge-m3(8192 토큰, 다국어)로 교체. 서버 공용 HF 캐시에 이미 있음.
  embedding_model: "BAAI/bge-m3"
  weights:
    persona: 1.0
    engagement: 1.0
    diversity: 0.8
    novelty: 0.5
    grounding: 0.0    # RAG 근거 검색 파이프라인이 붙기 전까지 비활성 (docs/reward_design_v2.md §3.5)
  persona:
    lambda_syc: 1.0
    # sycophancy 페널티에 key-point coverage 게이트 적용 (docs/reward_design_v2.md §3.1):
    # 상대 논점을 정면으로 다루며 가까워진 것(반박/교전)은 완화하고, 논점을 회피하며
    # 가까워진 것(동조)만 강하게 처벌. false면 v2 초안처럼 무조건 페널티.
    syc_coverage_gate: true
    judge_aux_weight: 0.0    # >0으로 주면 judge 성향점수(S)를 보조 신호로 추가
  engagement:
    judge_weight: 0.0        # >0으로 주면 key-point coverage + judge 1~5점을 혼합
  novelty:
    tau: 0.25
    gamma: 1.5
  # R_persona anchor: rl/build_anchor.py --side {left,right} 실행이 아래 파일을 생성한다.
  # (샘플 텍스트 리스트 → 각각 임베딩 후 평균. 파일이 없으면 학습 시작 시 에러로 막음.)
  anchor_files:
    left: "rl/data/anchors/left.json"
    right: "rl/data/anchors/right.json"


# ── v3: v2 + 성향 유지/반박 품질/토론 전개 3축 강화 ─────────
v3:
  embedding_model: "BAAI/bge-m3"
  weights:
    # 1) 성향 유지: SFT adapter가 만든 정치적 정체성에서 벗어나지 않기
    stance_alignment: 1.0
    # 2) 반박 품질: 상대 논점을 잡고 정면으로 반박하기
    issue_coverage: 1.1
    direct_rebuttal: 0.5
    # 3) 토론 전개: 반복/수렴을 줄이고 새 논점으로 진행하기
    semantic_distinctiveness: 1.0
    argument_advancement: 0.6
    lexical_anti_repetition: 0.4
    late_loop_penalty: 0.7
    # 4) 근거 충실도: RAG/NLI 붙기 전까지 비활성
    evidence_grounding: 0.0
  stance_alignment:
    lambda_syc: 1.0
    syc_coverage_gate: true
    judge_aux_weight: 0.0
  issue_coverage:
    judge_weight: 0.0
  direct_rebuttal:
    cue_weight: 0.35
  argument_advancement:
    min_round: 2
    coverage_floor: 0.25
  lexical_anti_repetition:
    tau: 0.25
    gamma: 1.5
  late_loop_penalty:
    late_start: 4
    tau: 0.18
    gamma: 2.5
  # v2와 동일하게 anchor_files가 있으면 우선 사용한다. 없으면 rl/rewards/v2_redesign.py가
  # config/prompts.yaml + 대표 페르소나 발화 샘플로 fallback anchor를 만든다.
  anchor_files:
    left: "rl/data/anchors/left.json"
    right: "rl/data/anchors/right.json"
